name: Python security tests

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check tabulate
      - name: Compile Python source
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
